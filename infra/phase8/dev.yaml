AWSTemplateFormatVersion: '2010-09-09'
Description: Sharp Shooter Dev inference with IAM operations and Cognito App routes.

Parameters:
  InferenceImageUri:
    Type: String
  ApiCodeBucket:
    Type: String
  ApiCodeKey:
    Type: String
  WorkerTimeoutSeconds:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 900
  WorkerMemoryMb:
    Type: Number
    Default: 3008
    MinValue: 1024
    MaxValue: 10240
  WorkerEphemeralStorageMb:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 10240
  ResultsRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
  ReferenceCatalogKey:
    Type: String
    Default: ''
    AllowedPattern: '^$|^references/catalog-[0-9a-f]{64}\.json$'
  ResultVideoEnabled:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
  CoachingEnabled:
    Type: String
    Default: '0'
    AllowedValues: ['0', '1']
  OpenAiApiKeyParameterName:
    Type: String
    Default: /sharp-shooter/dev/openai-api-key
    AllowedPattern: '^/sharp-shooter/dev/[A-Za-z0-9/_-]+$'
  CoachingLeaseSeconds:
    Type: Number
    Default: 90
    MinValue: 31
  MaxCoachingAttempts:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
  OpenAiModel:
    Type: String
    Default: gpt-5.4-nano
  QueueVisibilitySeconds:
    Type: Number
    Default: 1800
    MinValue: 180
    MaxValue: 43200
  ProcessingLeaseSeconds:
    Type: Number
    Default: 360
    MinValue: 31
  MaxProcessingAttempts:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
  WorkerDiagnosticsEnabled:
    Type: String
    Default: '1'
    AllowedValues: ['0', '1']
  AllowCognitoSelfSignup:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

Conditions:
  DisableCognitoSelfSignup: !Equals [!Ref AllowCognitoSelfSignup, 'false']

Resources:
  AppUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: sharp-shooter-dev-app
      UserPoolTier: LITE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: !If [DisableCognitoSelfSignup, true, false]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      UserPoolTags:
        Project: sharp-shooter
        Environment: dev

  AppUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'sharp-shooter-dev-${AWS::AccountId}-${AWS::Region}'
      UserPoolId: !Ref AppUserPool
      ManagedLoginVersion: 1

  AppUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AppUserPool
      ClientName: sharp-shooter-dev-mobile
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs:
        - 'com.codingminds.shotrater://oauth/callback'
      LogoutURLs:
        - 'com.codingminds.shotrater://oauth/logout'
      SupportedIdentityProviders: [COGNITO]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  InferenceDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sharp-shooter-dev-inference-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: sharp-shooter
        - Key: Environment
          Value: dev

  InferenceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sharp-shooter-dev-inference
      VisibilityTimeout: !Ref QueueVisibilitySeconds
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt InferenceDlq.Arn
        maxReceiveCount: 5
      Tags:
        - Key: Project
          Value: sharp-shooter
        - Key: Environment
          Value: dev

  CoachingDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sharp-shooter-dev-coaching-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CoachingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sharp-shooter-dev-coaching
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CoachingDlq.Arn
        maxReceiveCount: 5

  UploadQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref InferenceQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowOnlyThisBucketToSend
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt InferenceQueue.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:s3:::sharp-shooter-dev-uploads-${AWS::AccountId}-${AWS::Region}'
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn: UploadQueuePolicy
    Properties:
      BucketName: !Sub 'sharp-shooter-dev-uploads-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploaded-videos
            Prefix: uploads/
            Status: Enabled
            ExpirationInDays: 2
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: expire-processed-videos
            Prefix: results/
            Status: Enabled
            ExpirationInDays: !Ref ResultsRetentionDays
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt InferenceQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      Tags:
        - Key: Project
          Value: sharp-shooter
        - Key: Environment
          Value: dev

  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub '${UploadBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sharp-shooter-dev-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: sharp-shooter
        - Key: Environment
          Value: dev

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sharp-shooter-dev-inference
      RetentionInDays: 14

  CoachingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sharp-shooter-dev-coaching
      RetentionInDays: 14

  CreateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sharp-shooter-dev-create-job
      RetentionInDays: 14

  GetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/sharp-shooter-dev-get-job
      RetentionInDays: 14

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sharp-shooter-dev-inference
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inference-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${UploadBucket.Arn}/uploads/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${UploadBucket.Arn}/references/catalog-*.json'
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${UploadBucket.Arn}/results/*'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt InferenceQueue.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt CoachingQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sharp-shooter-dev-inference:*'

  CoachingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sharp-shooter-dev-coaching
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: coaching-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt CoachingQueue.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${OpenAiApiKeyParameterName}'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sharp-shooter-dev-coaching:*'

  CreateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sharp-shooter-dev-create-job
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: create-job-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${UploadBucket.Arn}/uploads/*'
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sharp-shooter-dev-create-job:*'

  GetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sharp-shooter-dev-get-job
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: get-job-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt JobsTable.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${UploadBucket.Arn}/results/*'
                  - !Sub '${UploadBucket.Arn}/references/videos/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/sharp-shooter-dev-get-job:*'

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: sharp-shooter-dev-inference
      PackageType: Image
      Architectures:
        - x86_64
      Code:
        ImageUri: !Ref InferenceImageUri
      Role: !GetAtt WorkerRole.Arn
      Timeout: !Ref WorkerTimeoutSeconds
      MemorySize: !Ref WorkerMemoryMb
      EphemeralStorage:
        Size: !Ref WorkerEphemeralStorageMb
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          JOBS_TABLE: !Ref JobsTable
          PROCESSING_LEASE_SECONDS: !Ref ProcessingLeaseSeconds
          MAX_PROCESSING_ATTEMPTS: !Ref MaxProcessingAttempts
          WORKER_DIAGNOSTICS_ENABLED: !Ref WorkerDiagnosticsEnabled
          RESULT_VIDEO_ENABLED: !Ref ResultVideoEnabled
          NBA_REFERENCE_CATALOG_KEY: !Ref ReferenceCatalogKey
          COACHING_ENABLED: !Ref CoachingEnabled
          COACHING_QUEUE_URL: !Ref CoachingQueue
      Tags:
        - Key: Project
          Value: sharp-shooter
        - Key: Environment
          Value: dev

  CreateFunction:
    Type: AWS::Lambda::Function
    DependsOn: CreateLogGroup
    Properties:
      FunctionName: sharp-shooter-dev-create-job
      Runtime: python3.12
      Handler: job_api.create_job.lambda_handler
      Code:
        S3Bucket: !Ref ApiCodeBucket
        S3Key: !Ref ApiCodeKey
      Role: !GetAtt CreateRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          JOBS_TABLE: !Ref JobsTable

  GetFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetLogGroup
    Properties:
      FunctionName: sharp-shooter-dev-get-job
      Runtime: python3.12
      Handler: job_api.get_job.lambda_handler
      Code:
        S3Bucket: !Ref ApiCodeBucket
        S3Key: !Ref ApiCodeKey
      Role: !GetAtt GetRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          UPLOAD_BUCKET: !Ref UploadBucket

  CoachingFunction:
    Type: AWS::Lambda::Function
    DependsOn: CoachingLogGroup
    Properties:
      FunctionName: sharp-shooter-dev-coaching
      PackageType: Image
      Architectures: [x86_64]
      Code:
        ImageUri: !Ref InferenceImageUri
      ImageConfig:
        Command: [coaching_worker.lambda_handler]
      Role: !GetAtt CoachingRole.Arn
      Timeout: 30
      MemorySize: 1024
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          COACHING_LEASE_SECONDS: !Ref CoachingLeaseSeconds
          MAX_COACHING_ATTEMPTS: !Ref MaxCoachingAttempts
          OPENAI_API_KEY_PARAMETER: !Ref OpenAiApiKeyParameterName
          OPENAI_MODEL: !Ref OpenAiModel
          OPENAI_REASONING_EFFORT: low
          UPLOAD_BUCKET: !Ref UploadBucket

  WorkerEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt InferenceQueue.Arn
      FunctionName: !Ref WorkerFunction
      BatchSize: 1
      FunctionResponseTypes:
        - ReportBatchItemFailures
      ScalingConfig:
        MaximumConcurrency: 2
      Enabled: true

  CoachingEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt CoachingQueue.Arn
      FunctionName: !Ref CoachingFunction
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig:
        MaximumConcurrency: 2
      Enabled: true

  JobsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: sharp-shooter-dev-jobs
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false

  AppJwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref JobsApi
      Name: sharp-shooter-dev-app-jwt
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref AppUserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${AppUserPool}'

  CreateIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref JobsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CreateFunction.Arn
      PayloadFormatVersion: '2.0'

  GetIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref JobsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt GetFunction.Arn
      PayloadFormatVersion: '2.0'

  CreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref JobsApi
      RouteKey: 'POST /jobs'
      AuthorizationType: AWS_IAM
      Target: !Join
        - /
        - - integrations
          - !Ref CreateIntegration

  GetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref JobsApi
      RouteKey: 'GET /jobs/{job_id}'
      AuthorizationType: AWS_IAM
      Target: !Join
        - /
        - - integrations
          - !Ref GetIntegration

  AppCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref JobsApi
      RouteKey: 'POST /app/jobs'
      AuthorizationType: JWT
      AuthorizerId: !Ref AppJwtAuthorizer
      AuthorizationScopes: [openid]
      Target: !Join
        - /
        - - integrations
          - !Ref CreateIntegration

  AppGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref JobsApi
      RouteKey: 'GET /app/jobs/{job_id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AppJwtAuthorizer
      AuthorizationScopes: [openid]
      Target: !Join
        - /
        - - integrations
          - !Ref GetIntegration

  AppVideoRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref JobsApi
      RouteKey: 'GET /app/jobs/{job_id}/videos/{video_kind}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AppJwtAuthorizer
      AuthorizationScopes: [openid]
      Target: !Join
        - /
        - - integrations
          - !Ref GetIntegration

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref JobsApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  CreateInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${JobsApi}/*/POST/jobs'

  GetInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${JobsApi}/*/GET/jobs/*'

  AppCreateInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CreateFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${JobsApi}/*/POST/app/jobs'

  AppGetInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${JobsApi}/*/GET/app/jobs/*'

  AppVideoInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref GetFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${JobsApi}/*/GET/app/jobs/*/videos/*'

  DlqVisibleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sharp-shooter-dev-inference-dlq-visible
      AlarmDescription: Investigate failed inference messages in the Dev DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt InferenceDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  CoachingDlqVisibleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sharp-shooter-dev-coaching-dlq-visible
      AlarmDescription: Investigate failed AI coaching messages in the Dev DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CoachingDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Value: !Sub 'https://${JobsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  AppApiUrl:
    Value: !Sub 'https://${JobsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/app'
  AppUserPoolId:
    Value: !Ref AppUserPool
  AppUserPoolClientId:
    Value: !Ref AppUserPoolClient
  AppCognitoDomain:
    Value: !Sub 'https://${AppUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  UploadBucketName:
    Value: !Ref UploadBucket
  JobsTableName:
    Value: !Ref JobsTable
  InferenceQueueUrl:
    Value: !Ref InferenceQueue
  InferenceDlqUrl:
    Value: !Ref InferenceDlq
  CoachingQueueUrl:
    Value: !Ref CoachingQueue
  CoachingDlqUrl:
    Value: !Ref CoachingDlq
  WorkerFunctionName:
    Value: !Ref WorkerFunction
